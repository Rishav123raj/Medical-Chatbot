<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Medical Chatbot</title>
  <link rel="stylesheet" href="static/style.css"/>
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <i class="fas fa-notes-medical"></i> Medical Assistant
    </div>

    <div class="chat-messages" id="chatMessages">
      <!-- Messages will appear here -->
    </div>

    <form class="chat-input" id="chatForm">
      <input type="text" id="userInput" placeholder="Describe your symptoms..." autocomplete="off" required />
      <button type="submit">Send</button>
    </form>
  </div>

  <script>
    const chatForm = document.getElementById('chatForm');
    const userInput = document.getElementById('userInput');
    const chatMessages = document.getElementById('chatMessages');

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const question = userInput.value.trim();
      if (!question) return;

      appendMessage('user-message', question);
      userInput.value = '';

      appendMessage('bot-message', 'Thinking...');

      const reply = await getBotReply(question);

      // Replace the "Thinking..." message with actual reply
      chatMessages.lastChild.remove();
      appendMessage('bot-message', reply);
    });

    function appendMessage(className, text) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', className);
      msgDiv.innerText = text;
      chatMessages.appendChild(msgDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function getBotReply(question) {
      try {
        const formData = new FormData();
        formData.append("msg", question);

        const response = await fetch("/get", {
          method: "POST",
          body: formData,
        });

        if (!response.ok) {
          throw new Error("Network error");
        }

        const data = await response.text();
        return data;
      } catch (err) {
        console.error(err);
        return "Sorry, something went wrong. Please try again.";
      }
    }
  </script>

</body>
</html>
